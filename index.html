 <!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <title>Flowers & Mimos</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #fff9db 0%, #ffe3e3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .Spider-Man-cima {
            position: fixed;
            top: -10px;
            left: 20px;
            width: 220px;
            height: auto;
            z-index: 100;
            transform-origin: top center;
            animation: balancar 3s infinite ease-in-out;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.15));
        }

        @keyframes balancar {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }

        .my-melody-canto {
            position: fixed;
            bottom: 15px;
            right: 20px;
            width: 220px;
            height: auto;
            z-index: 100;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .my-melody-canto:hover {
            transform: scale(1.08) rotate(-3deg);
        }

        .main-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            text-align: center;
            z-index: 10;
            max-width: 90%;
            width: 420px;
            border: 2px solid #ffffff;
        }

        .description span {
            font-size: 22px;
            color: #d63384;
            letter-spacing: 0.5px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-mimo, .btn-link {
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-link {
            background-color: #ff758f;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 117, 143, 0.4);
        }

        .btn-mimo {
            background-color: #ff477e;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 71, 126, 0.4);
        }

        .btn-link:hover, .btn-mimo:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 18px rgba(255, 0, 85, 0.5);
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            font-size: 22px;
            animation: piscar 2s infinite ease-in-out;
            opacity: 0.4;
        }

        @keyframes piscar {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3) rotate(15deg); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        .fechar-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            color: #888;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .Spider-Man-cima { width: 140px; }
            .my-melody-canto { width: 140px; }
            .description span { font-size: 18px; }
        }
    </style>
</head>

<body>

    <!-- Homem-Aranha -->
    <img src="img/ spider.png" alt="Spider Man" class="Spider-Man-cima">

    <!-- Cartão Principal -->
    <div class="main-card">
        <div class="description">
            <span>Um mimo para começar o seu dia &lt;3</span>
        </div>

        <div class="button-group">
            <a href="flower.html" class="btn-link">Clique aqui gatinha</a>
            <button class="btn-mimo" type="button" onclick="gerarMimo()">Aperte!</button>
        </div>
    </div>

    <!-- My Melody -->
    <img src="img/ mymelody.png" alt="My Melody" class="my-melody-canto">

    <!-- Estrelas -->
    <div class="stars-container">
        <div class="star" style="top: 10%; left: 15%;">✨</div>
        <div class="star" style="top: 25%; left: 45%;">⭐</div>
        <div class="star" style="top: 15%; left: 75%;">✨</div>
        <div class="star" style="top: 50%; left: 10%;">⭐</div>
        <div class="star" style="top: 65%; left: 80%;">✨</div>
        <div class="star" style="top: 80%; left: 30%;">✨</div>
        <div class="star" style="top: 85%; left: 60%;">⭐</div>
        <div class="star" style="top: 40%; left: 88%;">✨</div>
    </div>

    <!-- Janela Pop-up (Modal) -->
    <div id="modal-mimo" class="modal-overlay">
        <div class="modal-card">
            <span class="fechar-btn" onclick="fecharMimo()">&times;</span>
            <div style="font-size: 40px; margin-bottom: 10px;">💖</div>
            <p id="texto-mimo" style="color: #444; font-size: 16px; margin-bottom: 20px; line-height: 1.4; font-weight: bold;"></p>
            <button class="btn-mimo" style="padding: 8px 18px; font-size: 14px;" onclick="gerarMimo()">Outra mensagem ✨</button>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        const mimos = [
            "Você tem esse dom de me fazer sorrir sem esforço nenhum. 💖",
             "O teu abraço encaixa direitinho e faz o tempo parar. 🌸 (Mantra)",
            "Tudo o que eu procuro, encontro no teu sorriso. ✨ (Inversa)",
            "Tem coisas na vida que a gente não explica, só sente — e contigo é assim. 🎶 (Beijo de Judas)",
            "Moça bonita, vc é o refúgio dessa minha vida corrida. 🌺 (Dilemas da Vida Moderna)"
        ];

        function gerarMimo() {
            const modal = document.getElementById("modal-mimo");
            const texto = document.getElementById("texto-mimo");
            
            const indice = Math.floor(Math.random() * mimos.length);
            texto.innerText = mimos[indice];
            
            modal.style.display = "flex";
        }

        function fecharMimo() {
            const modal = document.getElementById("modal-mimo");
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById("modal-mimo");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>

</html>
